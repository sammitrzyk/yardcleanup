<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thank You — Alejandro's Landscaping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" />
<style>
:root{
  --forest:#173f2b; --green:#3f8a3a; --green-dk:#326f2e;
  --amber:#d9851b; --amber-dk:#bd6f10;
  --cream:#f6f1e7; --ink:#17201a; --muted:#5b645d; --line:#e2ddd1; --white:#fff;
  --r:14px; --shadow:0 14px 40px rgba(23,63,43,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Manrope,Arial,sans-serif;font-size:17px;line-height:1.6;color:var(--ink);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1{margin:0 0 .5em;line-height:1.1;font-weight:800;letter-spacing:-.015em;font-size:clamp(30px,4.6vw,44px);color:var(--forest)}
p{margin:0 0 1em}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.hdr{background:#fff;border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.hdr img{height:60px;width:auto}
.hdr a.tel{display:inline-flex;align-items:center;gap:8px;background:var(--forest);color:#fff;font-weight:800;text-decoration:none;font-size:17px;padding:11px 18px;border-radius:999px;white-space:nowrap}
.hdr a.tel svg{width:18px;height:18px;color:#fff}
@media (max-width:480px){.hdr .wrap{height:72px}.hdr img{height:44px}.hdr a.tel{padding:9px 13px;font-size:15px;gap:6px}.hdr a.tel svg{width:16px;height:16px}}
main{padding:80px 0;text-align:center}
.card{max-width:620px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:48px 32px}
.check{width:64px;height:64px;border-radius:50%;background:#eaf3e6;color:var(--green);display:grid;place-items:center;margin:0 auto 22px}
.lede{font-size:19px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--amber);color:#fff;font:800 18px/1.2 Manrope,Arial,sans-serif;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;border:0;border-radius:var(--r);padding:19px 32px;cursor:pointer;box-shadow:0 8px 22px rgba(217,133,27,.32);margin-top:26px}
.btn:hover{background:var(--amber-dk)}
footer{background:#0f2a1c;color:rgba(255,255,255,.7);font-size:14px;padding:26px 0;text-align:center}
footer a{color:#fff}
</style>
</head><body>

<header class="hdr">
  <div class="wrap">
    <img src="img/logo.png" alt="Alejandro's Landscaping" width="167" height="60" />
    <a class="tel" href="tel:+17177366538" data-event="call_click">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      <span class="num">(717) 736-6538</span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="card">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="30" height="30"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>Thanks — Your Request Is In!</h1>
      <p class="lede">We've received your fall cleanup estimate request and will reach out shortly to get you a price. If it's urgent, give us a call.</p>
      <a class="btn" href="tel:+17177366538">Call (717) 736-6538</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="yr">2026</span> Alejandro's Landscaping · New Cumberland, PA · <a href="tel:+17177366538">(717) 736-6538</a></div>
</footer>

<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body></html>
